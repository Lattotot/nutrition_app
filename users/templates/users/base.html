{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Nutrition App{% endblock %}</title>

    <link rel="manifest" href="{% static 'manifest.json' %}">
    <meta name="theme-color" content="#0d6efd">
    <link rel="apple-touch-icon" href="{% static 'icons/icon-192.png' %}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(180deg, #f4f7fb 0%, #eef3f9 100%);
            min-height: 100vh;
        }

        .app-navbar {
            background: linear-gradient(90deg, #1f6feb 0%, #3b82f6 100%);
            box-shadow: 0 6px 20px rgba(31, 111, 235, 0.18);
        }

        .app-brand {
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .app-card {
            border: 0;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        }

        .metric-card {
            border: 0;
            border-radius: 18px;
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
        }

        .soft-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
        }

        .bg-soft-primary {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .bg-soft-success {
            background: #dcfce7;
            color: #15803d;
        }

        .bg-soft-warning {
            background: #ffedd5;
            color: #c2410c;
        }

        .bg-soft-danger {
            background: #fee2e2;
            color: #dc2626;
        }

        .app-navbar .nav-link,
        .app-navbar .navbar-brand {
            color: #ffffff !important;
        }

        .app-navbar .nav-link {
            opacity: 0.92;
        }

        .app-navbar .nav-link:hover {
            opacity: 1;
        }

        @media (max-width: 768px) {
            body {
                font-size: 15px;
            }

            .container,
            .content-shell {
                padding-left: 14px !important;
                padding-right: 14px !important;
            }

            .app-navbar .container {
                padding-left: 12px !important;
                padding-right: 12px !important;
            }

            .navbar-brand.app-brand {
                font-size: 1.6rem;
                font-weight: 800;
            }

            .section-card,
            .meal-card,
            .app-card,
            .metric-card {
                border-radius: 18px !important;
                padding: 18px !important;
            }

            .section-title {
                font-size: 1.15rem !important;
                margin-bottom: 12px !important;
            }

            h1.h2,
            .h2 {
                font-size: 2rem !important;
                line-height: 1.1;
                margin-bottom: 8px !important;
            }

            .text-muted {
                font-size: 0.95rem;
            }

            .metric-card {
                min-height: auto !important;
            }

            .metric-title {
                font-size: 0.95rem !important;
                margin-bottom: 10px !important;
            }

            .metric-value {
                font-size: 2.1rem !important;
                margin-bottom: 10px !important;
            }

            .metric-badge,
            .soft-badge {
                font-size: 0.9rem !important;
                padding: 7px 12px !important;
            }

            .water-mini-card {
                padding: 16px !important;
                border-radius: 14px !important;
            }

            .water-mini-card .label {
                font-size: 0.9rem !important;
            }

            .water-mini-card .value {
                font-size: 1.15rem !important;
            }

            .date-toolbar {
                display: grid !important;
                grid-template-columns: 1fr 1fr !important;
                gap: 10px !important;
                align-items: stretch !important;
            }

            .date-toolbar .form-group {
                grid-column: 1 / -1;
                min-width: 100% !important;
                margin-bottom: 0 !important;
            }

            .date-toolbar .btn,
            .date-toolbar a.btn {
                min-width: 0 !important;
                width: 100% !important;
            }

            .date-toolbar input[type="date"] {
                height: 50px;
                font-size: 1rem;
            }

            .btn {
                min-height: 46px;
                font-size: 1rem;
                border-radius: 12px !important;
            }

            .btn-sm {
                min-height: 38px;
                font-size: 0.92rem;
                padding: 6px 12px;
            }

            .d-flex.justify-content-between.align-items-center.mb-4.flex-wrap.gap-3 {
                align-items: flex-start !important;
                gap: 14px !important;
            }

            .d-flex.justify-content-between.align-items-center.mb-4.flex-wrap.gap-3 > div:last-child,
            .d-flex.justify-content-between.align-items-center.mb-4.flex-wrap.gap-3 > a,
            .d-flex.justify-content-between.align-items-center.mb-4.flex-wrap.gap-3 .btn {
                width: 100%;
            }

            .action-toolbar {
                flex-wrap: wrap;
                gap: 8px !important;
            }

            .action-toolbar .btn {
                flex: 1 1 calc(50% - 4px);
            }

            .recommendation-list li {
                padding: 12px 14px !important;
                font-size: 0.95rem;
                line-height: 1.45;
            }

            .meal-list li + li {
                margin-top: 12px !important;
            }

            .meal-product-name {
                font-size: 1rem;
            }

            .meal-product-amount {
                font-size: 0.92rem;
            }

            .progress-custom {
                height: 14px !important;
            }

            .progress-custom .progress-bar {
                font-size: 11px !important;
            }

            form .row > div,
            .row.g-4 > div,
            .row.g-3 > div {
                margin-bottom: 0;
            }

            .card-body,
            .card {
                border-radius: 18px !important;
            }

            input,
            select,
            textarea {
                min-height: 48px;
                font-size: 1rem !important;
                border-radius: 12px !important;
            }

            label.form-label {
                font-size: 0.95rem;
                margin-bottom: 6px;
            }

            .navbar-toggler {
                padding: 8px 12px;
                border-radius: 12px !important;
            }
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg app-navbar mb-4">
    <div class="container">
        <a class="navbar-brand app-brand" href="{% url 'home' %}">Nutrition App</a>

        <button class="navbar-toggler bg-white" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarContent">
            <div class="navbar-nav ms-auto align-items-lg-center">
                {% if user.is_authenticated %}
                    <a class="nav-link" href="{% url 'profile' %}">Профиль</a>
                    <a class="nav-link" href="{% url 'meals' %}">Рацион</a>
                    <a class="nav-link" href="{% url 'progress' %}">Прогресс</a>

                    <form method="post" action="{% url 'logout' %}" class="d-inline ms-lg-2">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-link nav-link text-white text-decoration-none p-0 border-0">
                            Выход
                        </button>
                    </form>
                {% else %}
                    <a class="nav-link" href="{% url 'login' %}">Вход</a>
                    <a class="nav-link" href="{% url 'register' %}">Регистрация</a>
                {% endif %}
            </div>
        </div>
    </div>
</nav>

<main class="container pb-4 content-shell">
    {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
            navigator.serviceWorker.register("/static/sw.js")
                .then(function (registration) {
                    console.log("Service Worker зарегистрирован:", registration.scope);
                })
                .catch(function (error) {
                    console.log("Ошибка регистрации Service Worker:", error);
                });
        });
    }
</script>
</body>
</html>
